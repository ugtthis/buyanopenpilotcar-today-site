name: Validate Reference Data

on:
  pull_request:
    paths:
      - pipeline/data/ref/CARS.md
      - pipeline/package_keywords.json

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
      - run: uv sync
        working-directory: pipeline

      - name: Validate package key coverage
        id: validate_package_keys
        continue-on-error: true
        run: |
          uv run python scripts/check_package_key_coverage.py \
            --input data/ref/CARS.md \
            --package-keywords package_keywords.json \
            --output-json package-key-coverage.json \
            --github-output "$GITHUB_OUTPUT"
          cat package-key-coverage.json
        working-directory: pipeline

      - name: Comment missing package keys on PR
        if: steps.validate_package_keys.outputs.has_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          uv run python scripts/render_missing_package_keys_comment.py \
            --coverage-json package-key-coverage.json \
            --output-md /tmp/missing-package-keys-comment.md

          EXISTING_COMMENT_ID="$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- package-keywords-missing -->")) | .id' | tail -n 1)"

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT_ID" \
              --method PATCH \
              --field body@/tmp/missing-package-keys-comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/missing-package-keys-comment.md
          fi
        working-directory: pipeline

      - name: Fail when package key validation fails
        if: steps.validate_package_keys.outputs.validate_status != '0'
        run: exit 1

      - name: Verify generated ref data is current
        if: steps.validate_package_keys.outputs.validate_status == '0'
        run: |
          bash scripts/regenerate_reference_data.sh
          git diff --exit-code -- data/ref/opendbc_ref.json
        working-directory: pipeline
